name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86_64-native:
    name: x86_64 native (expose API errors fast)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang lld pkg-config rsync python3-pip \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev zlib1g-dev
          # Godot 4.7 要求 SCons >= 4.4，apt 源里的 4.0.1 不够
          sudo pip3 install -q "scons>=4.5"

      - name: tool versions
        run: |
          scons --version | sed -n 2p
          clang --version | head -1
          pkg-config --modversion sdl2

      - name: fetch godot 4.7 source
        run: |
          curl -sSL -o /tmp/g.tar.xz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/godot-4.7-stable.tar.xz
          tar -xf /tmp/g.tar.xz
          echo "SRC=$PWD/godot-4.7-stable" >> "$GITHUB_ENV"
          ls -d godot-4.7-stable

      - name: install frt into platform/frt
        run: |
          rm -rf "$SRC/platform/frt"
          mkdir -p "$SRC/platform/frt"
          rsync -a --exclude=.git --exclude='.github' "$GITHUB_WORKSPACE/frt/" "$SRC/platform/frt/"
          echo "--- platform/frt ---"
          ls "$SRC/platform/frt" | head -30

      # 注意：不做"只编一个 .o"的冒烟闸门 —— scons 首个编的就是 platform/frt，
      # 全量编译本身 20 秒内就会暴露平台代码错误，冒烟不但没提速还曾假绿过一次。
      - name: build (full)
        run: |
          cd "$SRC"
          # vulkan=false 必须有：Godot 默认 vulkan=true，会定义 VULKAN_ENABLED，
          # 进而 include 4.7 里已改名的 drivers/vulkan/rendering_device_vulkan.h
          scons platform=frt target=template_release use_llvm=yes \
                vulkan=false openxr=false -j"$(nproc)" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "=========== build exit=$rc ==========="
          if [ "$rc" != "0" ]; then
            grep -E 'error:|fatal error:|scons: \*\*\*' /tmp/build.log | head -120 || true
            exit "$rc"
          fi

      - name: list binaries
        run: |
          find "$SRC/bin" -maxdepth 1 -type f | head -20
          file "$SRC"/bin/* 2>/dev/null | head -10

      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-x86_64
          path: /tmp/build.log
          retention-days: 7

  arm64-cross:
    name: arm64 cross (bullseye glibc 2.31, static libstdc++)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    container:
      image: debian:bullseye
    steps:
      - name: bootstrap toolchain
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          ARCHIVE=http://archive.debian.org/debian

          # ★ 核心决定：**不启用 arm64 外来架构**。
          # 之前 dpkg --add-architecture arm64 会要求 libc6:amd64 与 libc6:arm64 版本号
          # 逐字节相同；而 debian:bullseye 镜像自带 +deb11u14（来自已归档的 security），
          # archive.debian.org 只有 u11 ⇒ 依赖求解死锁（--allow-downgrades 也救不了）。
          # 改法：libc/工具链走 Debian 官方的 *-cross 包（Architecture: amd64，内含
          # aarch64 sysroot，不进外来架构体系）；SDL2/EGL/GLES/zlib 的 arm64 dev 包
          # 直接 curl .deb + dpkg -x 展开，完全绕开 apt 依赖求解器。

          printf '%s\n' "deb [trusted=yes] $ARCHIVE bullseye main contrib non-free" > /etc/apt/sources.list
          printf '%s\n' 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid
          apt-get update
          # 镜像自带 libc6 +deb11u14 / perl-base +deb11u5，archive 只有 u11 / u3。
          # ★ --allow-downgrades 只影响"装哪个版本"，**不会主动降级已安装的包** ⇒
          #   必须先整轮 upgrade 把镜像自带版本降到 archive 版本，否则
          #   libc6-dev 的 "Depends: libc6 (= 2.31-13+deb11u11)" 永远对不上 u14。
          apt-get -y --allow-downgrades upgrade \
            || apt-get install -y --allow-downgrades \
                 libc6=2.31-13+deb11u11 libc6-dev=2.31-13+deb11u11 \
                 perl=5.32.1-4+deb11u3 perl-base=5.32.1-4+deb11u3 \
            || echo "!! 降级未完全成功，继续尝试正常安装"
          apt-get install -y --allow-downgrades --no-install-recommends \
            ca-certificates curl git rsync python3 python3-pip file tar xz-utils \
            build-essential pkg-config gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          pip3 install -q "scons>=4.5"

          # arm64 索引只用来查 pool 路径，不喂给 apt 求解器
          curl -fsSL "$ARCHIVE/dists/bullseye/main/binary-arm64/Packages.xz" | xz -d > /tmp/Pkgs-arm64
          echo "arm64 索引条目数: $(grep -c '^Package: ' /tmp/Pkgs-arm64)"

          extract_arm64() {
            _f=$(grep -A60 "^Package: $1\$" /tmp/Pkgs-arm64 | grep -m1 '^Filename:' | awk '{print $2}')
            if [ -z "$_f" ]; then echo "  (跳过 $1: 索引里没有)"; return 0; fi
            curl -fsSL -o /tmp/x.deb "$ARCHIVE/$_f"
            dpkg -x /tmp/x.deb /
            echo "  展开 $1  <- $_f"
          }
          # EGL/GLES 的 dev 包在 bullseye 有两套命名，两套都试（重复展开无害）
          for p in libsdl2-dev libsdl2-2.0-0 zlib1g-dev zlib1g \
                   libegl-dev libegl1 libgles-dev libgles2 \
                   libegl1-mesa-dev libgles2-mesa-dev; do
            extract_arm64 "$p"
          done

          # 硬断言：缺任何一个都直接红，不许拖到链接阶段才发现
          for need in /usr/include/SDL2/SDL.h /usr/include/GLES3/gl3.h \
                      /usr/lib/aarch64-linux-gnu/libSDL2.so \
                      /usr/lib/aarch64-linux-gnu/libEGL.so \
                      /usr/lib/aarch64-linux-gnu/libGLESv2.so; do
            test -e "$need" || { echo "!! 缺 $_need"; exit 1; }
          done

          # FRT 的 configure_cross 会调 <triple>-pkg-config，Debian 没现成的，自己包一层。
          # 用 PKG_CONFIG_LIBDIR（不是 PATH）避免混进宿主 x86 的 .pc
          printf '%s\n' \
            '#!/bin/sh' \
            'export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig' \
            'export PKG_CONFIG_SYSROOT_DIR=/' \
            'exec pkg-config "$@"' \
            > /usr/local/bin/aarch64-linux-gnu-pkg-config
          chmod +x /usr/local/bin/aarch64-linux-gnu-pkg-config

          echo "--- toolchain ---"
          aarch64-linux-gnu-gcc --version | head -1
          scons --version | sed -n 2p
          ldd --version | head -1
          echo "--- sdl2 (arm64) via wrapper ---"
          aarch64-linux-gnu-pkg-config --modversion sdl2
          aarch64-linux-gnu-pkg-config --libs sdl2

      - uses: actions/checkout@v4

      - name: fetch godot 4.7 source
        run: |
          curl -sSL -o /tmp/g.tar.xz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/godot-4.7-stable.tar.xz
          tar -xf /tmp/g.tar.xz
          echo "SRC=$PWD/godot-4.7-stable" >> "$GITHUB_ENV"
          ls -d godot-4.7-stable

      - name: install frt into platform/frt
        run: |
          rm -rf "$SRC/platform/frt"
          mkdir -p "$SRC/platform/frt"
          rsync -a --exclude=.git --exclude='.github' "$GITHUB_WORKSPACE/frt/" "$SRC/platform/frt/"
          ls "$SRC/platform/frt" | head -30

      - name: build arm64 (full)
        run: |
          cd "$SRC"
          scons platform=frt target=template_release \
                frt_arch=arm64v8 frt_cross=auto use_llvm=no use_static_cpp=yes \
                vulkan=false openxr=false optimize=speed debug_symbols=no \
                -j"$(nproc)" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "=========== build exit=$rc ==========="
          if [ "$rc" != "0" ]; then
            grep -E 'error:|fatal error:|scons: \*\*\*' /tmp/build.log | head -120 || true
            exit "$rc"
          fi

      - name: package + symbol audit
        run: |
          mkdir -p /tmp/out
          for f in "$SRC"/bin/*; do
            [ -f "$f" ] || continue
            cp "$f" /tmp/out/ 2>/dev/null || true
          done
          ls -la /tmp/out
          aarch64-linux-gnu-strip /tmp/out/* 2>/dev/null || true
          for f in /tmp/out/*; do
            echo "=== $(basename "$f") ==="
            file "$f"
            echo "--- GLIBC 需求上界（掌机 = 2.33，超过就跑不了）---"
            aarch64-linux-gnu-objdump -T "$f" 2>/dev/null \
              | grep -o 'GLIBC_2\.[0-9]*' | sort -u | tail -5
            echo "--- GLIBCXX 需求（静态链接应为空）---"
            aarch64-linux-gnu-objdump -T "$f" 2>/dev/null \
              | grep -o 'GLIBCXX_[0-9.]*' | sort -u | tail -5
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frt-arm64
          path: |
            /tmp/out
            /tmp/build.log
          retention-days: 7
