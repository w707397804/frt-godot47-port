name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  x86_64-native:
    name: x86_64 native (expose API errors fast)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang lld pkg-config rsync python3-pip \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev zlib1g-dev
          # Godot 4.7 要求 SCons >= 4.4，apt 源里的 4.0.1 不够
          sudo pip3 install -q "scons>=4.5"

      - name: tool versions
        run: |
          scons --version | head -3
          clang --version | head -1
          pkg-config --modversion sdl2

      - name: fetch godot 4.7 source
        run: |
          curl -sSL -o /tmp/g.tar.xz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/godot-4.7-stable.tar.xz
          tar -xf /tmp/g.tar.xz
          echo "SRC=$PWD/godot-4.7-stable" >> "$GITHUB_ENV"
          ls -d godot-4.7-stable

      - name: install frt into platform/frt
        run: |
          rm -rf "$SRC/platform/frt"
          mkdir -p "$SRC/platform/frt"
          rsync -a --exclude=.git --exclude='.github' "$GITHUB_WORKSPACE/frt/" "$SRC/platform/frt/"
          echo "--- platform/frt ---"
          ls "$SRC/platform/frt" | head -30

      - name: build
        run: |
          cd "$SRC"
          scons platform=frt target=template_release use_llvm=yes -j"$(nproc)" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "=========== build exit=$rc ==========="
          if [ "$rc" != "0" ]; then
            echo "--- error 行 ---"
            grep -E 'error:|fatal error:|AttributeError|ImportError|ImportError|NameError|scons: \*\*\*' /tmp/build.log | head -60 || true
            exit "$rc"
          fi

      - name: list binaries
        run: |
          echo "--- bin/ ---"
          find "$SRC/bin" -maxdepth 1 -type f | head -20
          file "$SRC"/bin/* 2>/dev/null | head -10

      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-x86_64
          path: /tmp/build.log
          retention-days: 7
